  <!-- APPLICATION LOGIC & CRYPTOGRAPHY ENGINE -->
  <script>
    // -------------------------------------------------------------
    // Helper: HTML Escaping
    // -------------------------------------------------------------
    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // -------------------------------------------------------------
    // 1. SOLVABILITY & HALL'S MARRIAGE THEOREM ENGINE
    // -------------------------------------------------------------
    function checkSolvability(names, exclusions = {}) {
      const n = names.length;
      if (n < 3) {
        return {
          solvable: false,
          error: `Se requieren al menos 3 participantes para realizar el sorteo (actualmente hay ${n}).`,
          adj: []
        };
      }

      const nameToIdx = new Map();
      names.forEach((name, idx) => nameToIdx.set(name, idx));

      const adj = [];
      for (let i = 0; i < n; i++) {
        const giverName = names[i];
        const rawExcl = exclusions[giverName] || [];
        const exclSet = new Set(rawExcl.filter(ex => nameToIdx.has(ex)).map(ex => nameToIdx.get(ex)));
        exclSet.add(i); // Self-exclusion

        const validRecipients = [];
        for (let j = 0; j < n; j++) {
          if (!exclSet.has(j)) validRecipients.push(j);
        }

        if (validRecipients.length === 0) {
          return {
            solvable: false,
            error: `El participante '${giverName}' no tiene a quién regalar debido a sus exclusiones. Modifica las restricciones.`,
            adj: []
          };
        }
        adj.push(validRecipients);
      }

      // Verify every participant can receive from at least one peer
      for (let j = 0; j < n; j++) {
        const hasGiver = adj.some(recipients => recipients.includes(j));
        if (!hasGiver) {
          return {
            solvable: false,
            error: `El participante '${names[j]}' ha sido excluido por todos los demás compañeros y no puede recibir ningún regalo.`,
            adj: []
          };
        }
      }

      // Kuhn's Maximum Bipartite Matching Algorithm (O(V * E))
      const matchV = new Array(n).fill(-1);
      const matchU = new Array(n).fill(-1);

      function dfs(u, visited) {
        for (const v of adj[u]) {
          if (!visited[v]) {
            visited[v] = true;
            if (matchV[v] === -1 || dfs(matchV[v], visited)) {
              matchV[v] = u;
              matchU[u] = v;
              return true;
            }
          }
        }
        return false;
      }

      for (let u = 0; u < n; u++) {
        const visited = new Array(n).fill(false);
        dfs(u, visited);
      }

      const unmatchedU = [];
      for (let u = 0; u < n; u++) {
        if (matchU[u] === -1) unmatchedU.push(u);
      }

      if (unmatchedU.length === 0) {
        return { solvable: true, error: null, adj };
      }

      // Hall's Marriage Theorem Violator Subset Extraction:
      // Trace alternating tree from unmatched nodes in U
      const visitedU = new Array(n).fill(false);
      const visitedV = new Array(n).fill(false);
      const queue = [...unmatchedU];
      queue.forEach(u => visitedU[u] = true);

      while (queue.length > 0) {
        const currU = queue.shift();
        for (const v of adj[currU]) {
          if (!visitedV[v]) {
            visitedV[v] = true;
            const matchedU = matchV[v];
            if (matchedU !== -1 && !visitedU[matchedU]) {
              visitedU[matchedU] = true;
              queue.push(matchedU);
            }
          }
        }
      }

      const S = [];
      const NS = [];
      for (let i = 0; i < n; i++) {
        if (visitedU[i]) S.push(names[i]);
        if (visitedV[i]) NS.push(names[i]);
      }

      const explanation = `Conflicto de exclusión irresoluble: los participantes [${S.join(', ')}] (${S.length} personas) solo pueden regalar a [${NS.join(', ')}] (${NS.length} personas). Se necesitan al menos ${S.length} destinatarios distintos para un sorteo válido.`;

      return {
        solvable: false,
        error: explanation,
        adj: []
      };
    }

    // -------------------------------------------------------------
    // 2. HYBRID DERANGEMENT GENERATOR (REJECTION + MRV BACKTRACKING)
    // -------------------------------------------------------------
    function generateDerangement(names, exclusions = {}, maxRejectionTries = 300) {
      const solvability = checkSolvability(names, exclusions);
      if (!solvability.solvable) {
        throw new Error(solvability.error);
      }

      const n = names.length;
      const adj = solvability.adj;

      // Phase 1: Fisher-Yates Uniform Rejection Sampling
      for (let tryCount = 0; tryCount < maxRejectionTries; tryCount++) {
        const perm = Array.from({ length: n }, (_, i) => i);
        for (let i = n - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [perm[i], perm[j]] = [perm[j], perm[i]];
        }

        let valid = true;
        for (let u = 0; u < n; u++) {
          if (!adj[u].includes(perm[u])) {
            valid = false;
            break;
          }
        }

        if (valid) {
          const result = {};
          for (let u = 0; u < n; u++) {
            result[names[u]] = names[perm[u]];
          }
          return result;
        }
      }

      // Phase 2: Randomized MRV (Minimum Remaining Values) Backtracking
      const assignment = new Array(n).fill(-1);
      const usedV = new Array(n).fill(false);

      function backtrack() {
        let bestU = -1;
        let bestCandidates = null;

        for (let u = 0; u < n; u++) {
          if (assignment[u] === -1) {
            const cands = adj[u].filter(v => !usedV[v]);
            if (bestU === -1 || cands.length < bestCandidates.length) {
              bestU = u;
              bestCandidates = cands;
            }
          }
        }

        if (bestU === -1) return true;
        if (!bestCandidates || bestCandidates.length === 0) return false;

        // Shuffle candidates for maximum randomness & fairness
        for (let i = bestCandidates.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [bestCandidates[i], bestCandidates[j]] = [bestCandidates[j], bestCandidates[i]];
        }

        for (const v of bestCandidates) {
          assignment[bestU] = v;
          usedV[v] = true;
          if (backtrack()) return true;
          assignment[bestU] = -1;
          usedV[v] = false;
        }
        return false;
      }

      if (backtrack()) {
        const result = {};
        for (let u = 0; u < n; u++) {
          result[names[u]] = names[assignment[u]];
        }
        return result;
      }

      throw new Error("No se pudo generar una asignación válida tras la búsqueda exhaustiva.");
    }

    // -------------------------------------------------------------
    // 3. CRYPTOGRAPHIC TOKEN PACKING & PARSING
    // -------------------------------------------------------------
    function packTokenPayload(payloadObj) {
      const payload = JSON.stringify(payloadObj);
      const utf8Bytes = new TextEncoder().encode(payload);
      let checksum = 0;
      for (let i = 0; i < utf8Bytes.length; i++) {
        checksum = (checksum + utf8Bytes[i]) % 256;
      }

      // Packing: [version=1 (1B), checksum (1B), ...utf8Payload]
      const packed = new Uint8Array(2 + utf8Bytes.length);
      packed[0] = 1;
      packed[1] = checksum;
      packed.set(utf8Bytes, 2);

      let binary = '';
      for (let i = 0; i < packed.byteLength; i++) {
        binary += String.fromCharCode(packed[i]);
      }
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function unpackTokenPayload(token) {
      if (!token || typeof token !== 'string') {
        return { success: false, error: 'Token vacío o formato inválido.' };
      }
      const clean = token.trim();
      if (!/^[A-Za-z0-9_-]+$/.test(clean)) {
        return { success: false, error: 'El enlace contiene caracteres no válidos o caracteres corruptos.' };
      }

      let base64 = clean.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4 !== 0) {
        base64 += '=';
      }

      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      if (bytes.length < 2) {
        return { success: false, error: 'Enlace incompleto: la longitud de los datos es menor a la cabecera esperada.' };
      }

      let checksum;
      let dataBytes;

      if (bytes[0] === 1 && bytes.length >= 3) {
        checksum = bytes[1];
        dataBytes = bytes.subarray(2);
      } else {
        checksum = bytes[0];
        dataBytes = bytes.subarray(1);
      }

      let calcSum = 0;
      for (let i = 0; i < dataBytes.length; i++) {
        calcSum = (calcSum + dataBytes[i]) % 256;
      }

      if (calcSum !== checksum) {
        return {
          success: false,
          error: 'Integridad comprometida: la firma de seguridad no coincide. El enlace ha sido alterado o manipulado.'
        };
      }

      const jsonStr = new TextDecoder().decode(dataBytes);
      return { success: true, parsed: JSON.parse(jsonStr) };
    }

    function xorSealText(text, keyStr) {
      const textBytes = new TextEncoder().encode(text);
      const keyBytes = new TextEncoder().encode(keyStr);
      const out = new Uint8Array(textBytes.length);
      for (let i = 0; i < textBytes.length; i++) {
        out[i] = textBytes[i] ^ keyBytes[i % keyBytes.length];
      }
      let bin = '';
      for (let i = 0; i < out.length; i++) {
        bin += String.fromCharCode(out[i]);
      }
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function xorUnsealText(sealed, keyStr) {
      let b64 = sealed.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4 !== 0) b64 += '=';
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const keyBytes = new TextEncoder().encode(keyStr);
      const out = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) {
        out[i] = bytes[i] ^ keyBytes[i % keyBytes.length];
      }
      return new TextDecoder().decode(out);
    }

    function encodeParticipantToken(giver, receiver, event, budget, date) {
      return packTokenPayload({
        g: giver,
        r: receiver,
        t: receiver,
        e: event || "Amigo Invisible - 1º Máster de Teleco",
        b: budget || "",
        d: date || "",
        ts: Date.now()
      });
    }

    function decodeParticipantToken(token) {
      try {
        const unpacked = unpackTokenPayload(token);
        if (!unpacked.success) return unpacked;

        const parsed = unpacked.parsed;
        const giver = parsed.g;
        const receiver = parsed.r || parsed.t;

        if (!giver || !receiver) {
          return { success: false, error: 'Carga útil incompleta: faltan campos obligatorios de emisor o receptor.' };
        }

        return {
          success: true,
          giver: giver,
          receiver: receiver,
          target: receiver,
          event: parsed.e || 'Amigo Invisible - 1º Máster de Teleco',
          budget: parsed.b || '',
          date: parsed.d || '',
          ts: parsed.ts || 0
        };
      } catch (err) {
        return { success: false, error: `Error de decodificación: ${err.message}` };
      }
    }

    function encodeGroupToken(drawResult, event, budget, date) {
      const salt = Math.random().toString(36).slice(2, 8);
      const pairs = Object.entries(drawResult).map(([giver, receiver]) => [
        giver,
        xorSealText(receiver, `${giver}:${salt}`)
      ]);
      return packTokenPayload({
        k: 'group',
        s: salt,
        a: pairs,
        e: event || "Amigo Invisible - 1º Máster de Teleco",
        b: budget || "",
        d: date || "",
        ts: Date.now()
      });
    }

    function decodeGroupToken(token) {
      try {
        const unpacked = unpackTokenPayload(token);
        if (!unpacked.success) return unpacked;

        const parsed = unpacked.parsed;
        if (parsed.k !== 'group' || !Array.isArray(parsed.a) || parsed.a.length < 3 || !parsed.s) {
          return { success: false, error: 'Enlace de grupo incompleto o con formato no válido.' };
        }

        const participants = [];
        const sealedMap = {};
        for (const entry of parsed.a) {
          if (!Array.isArray(entry) || entry.length !== 2 || !entry[0] || !entry[1]) {
            return { success: false, error: 'Datos de participante corruptos en el enlace de grupo.' };
          }
          participants.push(entry[0]);
          sealedMap[entry[0]] = entry[1];
        }

        return {
          success: true,
          salt: parsed.s,
          participants,
          sealedMap,
          event: parsed.e || 'Amigo Invisible - 1º Máster de Teleco',
          budget: parsed.b || '',
          date: parsed.d || '',
          ts: parsed.ts || 0
        };
      } catch (err) {
        return { success: false, error: `Error de decodificación del grupo: ${err.message}` };
      }
    }

    // -------------------------------------------------------------
    // 4. PURE CANVAS CONFETTI ENGINE (~40 lines, zero dependencies)
    // -------------------------------------------------------------
    function launchConfettiCelebration() {
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#10b981', '#34d399', '#38bdf8', '#f59e0b', '#ec4899', '#a855f7', '#ffffff'];
      const particleCount = 110;
      const particles = [];

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height * 0.55,
          vx: (Math.random() - 0.5) * 18,
          vy: (Math.random() - 0.85) * 20,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 12,
          opacity: 1,
          decay: Math.random() * 0.015 + 0.008
        });
      }

      let animationFrameId;
      function updateConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let activeParticles = 0;

        particles.forEach(p => {
          p.vy += 0.42; // Gravity
          p.vx *= 0.98; // Drag
          p.x += p.vx;
          p.y += p.vy;
          p.rotation += p.rotSpeed;
          p.opacity -= p.decay;

          if (p.opacity > 0 && p.y < canvas.height + 50) {
            activeParticles++;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.globalAlpha = Math.max(0, p.opacity);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            ctx.restore();
          }
        });

        if (activeParticles > 0) {
          animationFrameId = requestAnimationFrame(updateConfetti);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          cancelAnimationFrame(animationFrameId);
        }
      }

      updateConfetti();
    }

    // -------------------------------------------------------------
    // 5. CLIPBOARD & TOAST HELPERS (WHATSAPP WEBVIEW OPTIMIZATION)
    // -------------------------------------------------------------
    async function copyTextToClipboard(text) {
      let copied = false;
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          copied = true;
        } catch (err) {
          console.warn('navigator.clipboard falló, usando fallback de textarea:', err);
        }
      }

      if (!copied) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        textarea.style.top = '-9999px';
        textarea.setAttribute('readonly', '');
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try {
          copied = document.execCommand('copy');
        } catch (e) {
          console.error('execCommand copy failed:', e);
        }
        document.body.removeChild(textarea);
      }

      if (copied) {
        showToast('Enlace copiado al portapapeles ✓');
      } else {
        showToast('No se pudo copiar automáticamente. Por favor, copia el enlace manualmente.');
      }
      return copied;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast-container');
      const textElem = toast.querySelector('span');
      if (textElem) textElem.textContent = msg;

      toast.classList.remove('opacity-0', 'translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(window.__toastTimeout);
      window.__toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-3');
      }, 2500);
    }

    function triggerHapticFeedback() {
      if (typeof navigator !== 'undefined' && navigator.vibrate) {
        try {
          navigator.vibrate([40, 50, 40]);
        } catch (e) {}
      }
    }

    // -------------------------------------------------------------

    // -------------------------------------------------------------
    function getRouteInfo() {
      // 1. Check URL Fragment (#g=... or #p=... or bare hash)
      if (window.location.hash) {
        const hashStr = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash;
        const hashParams = new URLSearchParams(hashStr);
        const groupToken = hashParams.get('g') || hashParams.get('group');
        if (groupToken) return { type: 'group', token: groupToken };
        const token = hashParams.get('p') || hashParams.get('token') || hashParams.get('data');
        if (token) return { type: 'participant', token };
        if (hashStr.length > 20 && !hashStr.includes('=')) return { type: 'participant', token: hashStr };
      }

      // 2. Check Query Parameters (?g=... or ?p=...)
      const urlParams = new URLSearchParams(window.location.search);
      const groupToken = urlParams.get('g') || urlParams.get('group');
      if (groupToken) return { type: 'group', token: groupToken };
      const pToken = urlParams.get('p') || urlParams.get('token') || urlParams.get('data');
      if (pToken) return { type: 'participant', token: pToken };

      return { type: 'organizer', token: null };
    }

    function initRouter() {
      const route = getRouteInfo();
      if (route.type === 'group') {
        handleGroupRoute(route.token);
      } else if (route.type === 'participant') {
        handleParticipantRoute(route.token);
      } else {
        handleOrganizerRoute();
      }
    }

    function handleGroupRoute(token) {
      const result = decodeGroupToken(token);
      if (!result.success) {
        renderErrorView(result.error);
        return;
      }

      AppState.group = {
        active: true,
        participants: result.participants,
        sealedMap: result.sealedMap,
        salt: result.salt,
        event: result.event,
        budget: result.budget,
        date: result.date
      };
      AppState.participant = {
        giver: '',
        target: '',
        event: result.event,
        budget: result.budget,
        date: result.date,
        isRevealed: false
      };

      renderGroupSelectorView();
    }

    function handleParticipantRoute(token) {
      const result = decodeParticipantToken(token);
      if (!result.success) {
        renderErrorView(result.error);
        return;
      }

      AppState.group.active = false;
      AppState.participant = {
        giver: result.giver,
        target: result.receiver,
        event: result.event,
        budget: result.budget,
        date: result.date,
        isRevealed: false
      };

      renderParticipantView();
    }

    function handleOrganizerRoute() {
      AppState.group.active = false;
      document.getElementById('view-participant').classList.add('hidden');
      document.getElementById('view-error').classList.add('hidden');
      document.getElementById('view-organizer').classList.remove('hidden');
      renderOrganizerView();
    }

    function navigateToOrganizer() {
      history.pushState({}, '', window.location.pathname);
      AppState.organizer.drawGenerated = false;
      AppState.organizer.lastError = null;
      handleOrganizerRoute();
    }

    // -------------------------------------------------------------
    // 9. ORGANIZER EVENTS BINDING
    // -------------------------------------------------------------
    function bindOrganizerEvents() {
      const org = AppState.organizer;

      // Add participant button & enter key
      const nameInput = document.getElementById('input-participant-name');
      const addBtn = document.getElementById('btn-add-participant');

      function handleAdd() {
        if (!nameInput) return;
        const name = nameInput.value.trim();
        const errSpan = document.getElementById('input-error');

        if (!name) return;

        // Duplicate check
        const exists = org.participants.some(p => p.name.toLowerCase() === name.toLowerCase());
        if (exists) {
          if (errSpan) {
            errSpan.textContent = 'Ya existe un participante con este nombre.';
            errSpan.classList.remove('hidden');
          }
          return;
        }

        if (errSpan) errSpan.classList.add('hidden');
        const newId = 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        org.participants.push({ id: newId, name: name, exclusions: [] });
        org.lastError = null;
        renderOrganizerView();
      }

      if (addBtn) addBtn.onclick = handleAdd;
      if (nameInput) {
        nameInput.onkeydown = (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            handleAdd();
          }
        };
      }

      // Bilateral exclusions toggle
      const bilateralToggle = document.getElementById('toggle-bilateral');
      if (bilateralToggle) {
        bilateralToggle.onchange = (e) => {
          org.bilateralExclusions = e.target.checked;
        };
      }

      // Metadata inputs
      const budgetInput = document.getElementById('input-meta-budget');
      if (budgetInput) {
        budgetInput.oninput = (e) => { org.eventDetails.budget = e.target.value; };
      }
      const dateInput = document.getElementById('input-meta-date');
      if (dateInput) {
        dateInput.oninput = (e) => { org.eventDetails.date = e.target.value; };
      }

      // Delegated events for participant list
      const listContainer = document.getElementById('participants-list-container');
      if (listContainer) {
        listContainer.onclick = (e) => {
          const target = e.target.closest('[data-action]');
          if (!target) return;

          const action = target.getAttribute('data-action');
          if (action === 'delete-participant') {
            const id = target.getAttribute('data-id');
            org.participants = org.participants.filter(p => p.id !== id);
            // Clean up any exclusions pointing to deleted participant
            org.participants.forEach(p => {
              p.exclusions = p.exclusions.filter(exId => exId !== id);
            });
            org.lastError = null;
            renderOrganizerView();
          } else if (action === 'toggle-exclusions-drawer') {
            const id = target.getAttribute('data-id');
            const drawer = document.getElementById(`drawer-${id}`);
            if (drawer) {
              drawer.classList.toggle('hidden');
            }
          } else if (action === 'toggle-exclusion') {
            const sourceId = target.getAttribute('data-source');
            const targetId = target.getAttribute('data-target');
            const sourceP = org.participants.find(p => p.id === sourceId);
            const targetP = org.participants.find(p => p.id === targetId);

            if (sourceP) {
              const idx = sourceP.exclusions.indexOf(targetId);
              if (idx >= 0) {
                sourceP.exclusions.splice(idx, 1);
                if (org.bilateralExclusions && targetP) {
                  const rIdx = targetP.exclusions.indexOf(sourceId);
                  if (rIdx >= 0) targetP.exclusions.splice(rIdx, 1);
                }
              } else {
                sourceP.exclusions.push(targetId);
                if (org.bilateralExclusions && targetP && !targetP.exclusions.includes(sourceId)) {
                  targetP.exclusions.push(sourceId);
                }
              }
              org.lastError = null;
              renderOrganizerView();
              // Re-open current drawer
              const currentDrawer = document.getElementById(`drawer-${sourceId}`);
              if (currentDrawer) currentDrawer.classList.remove('hidden');
            }
          }
        };
      }

      // Generate Draw button
      const genBtn = document.getElementById('btn-generate-draw');
      if (genBtn) {
        genBtn.onclick = () => {
          if (org.participants.length < 3) return;

          // Map participant ids to names for derangement algorithm
          const idToName = new Map();
          const nameToId = new Map();
          org.participants.forEach(p => {
            idToName.set(p.id, p.name);
            nameToId.set(p.name, p.id);
          });

          const names = org.participants.map(p => p.name);
          const exclusionsByName = {};
          org.participants.forEach(p => {
            exclusionsByName[p.name] = p.exclusions
              .map(exId => idToName.get(exId))
              .filter(Boolean);
          });

          try {
            const drawResult = generateDerangement(names, exclusionsByName);

            // Construct bearer token URLs
            const baseUrl = window.location.href.split('?')[0].split('#')[0];
            const links = [];

            for (const p of org.participants) {
              const giverName = p.name;
              const receiverName = drawResult[giverName];
              const token = encodeParticipantToken(
                giverName,
                receiverName,
                org.eventDetails.title,
                org.eventDetails.budget,
                org.eventDetails.date
              );
              // Primary URL routing uses fragment `#p=` for zero server log leakage
              const participantUrl = `${baseUrl}#p=${token}`;
              links.push({
                id: p.id,
                name: giverName,
                token: token,
                url: participantUrl
              });
            }

            const groupToken = encodeGroupToken(
              drawResult,
              org.eventDetails.title,
              org.eventDetails.budget,
              org.eventDetails.date
            );
            org.groupUrl = `${baseUrl}#g=${groupToken}`;
            org.generatedLinks = links;
            org.drawGenerated = true;
            org.lastError = null;
            renderOrganizerView();
          } catch (err) {
            org.lastError = err.message;
            renderOrganizerView();
          }
        };
      }
    }

            <span>¡Copiado!</span>
          `;
          setTimeout(() => {
            btn.innerHTML = originalText;

          AppState.participant.isRevealed = true;

          triggerHapticFeedback();
          launchConfettiCelebration();

      if (revealBtn) revealBtn.onclick = triggerReveal;
